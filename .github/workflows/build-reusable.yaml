name: Build

on:
  workflow_call:
    inputs:
      artifact-name:
        description: "Named identifier for the artifact, optional"
        type: string
      os:
        description: "OS list"
        type: string
        default: '["ubuntu-22.04","ubuntu-24.04"]'
      mode:
        description: "Mode list"
        type: string
        default: '["newlib","linux","musl","uclibc","picolibc"]'
      target:
        description: "Target list"
        type: string
        default: '["rv32gc-ilp32d","rv64gc-lp64d"]'
      compiler:
        description: "Compiler list"
        type: string
        default: '["gcc","llvm"]'
      cmodel:
        description: "C model list"
        type: string
        default: '[""]'
      languages:
        description: "Languages list"
        type: string
        default: '[""]'
      strip:
        description: "Options to build unstripped, stripped or both, must be one of 'unstripped', 'stripped', 'both'"
        type: string
        default: 'unstripped'
      report:
        description: "Generate build report"
        type: boolean
        default: true
      sim:
        description: "Simulator"
        type: string
        default: '[""]'
      build-sim:
        description: "Build simulator and include in the toolchain"
        type: boolean
        default: false
      use-prebuilt-gnu:
        description: >-
          Do not build the GNU toolchain, take it from the artifact that the
          gcc job of the same workflow run published, and build only LLVM on
          top of it. Requires compiler '["llvm"]'.
        type: boolean
        default: false
      multilib-generator:
        description: "Multilib generator string passed to --with-multilib-generator (newlib only)"
        type: string
        default: ""

env:
  submodule_paths: |
    binutils
    dejagnu
    gcc
    gdb
    glibc
    llvm
    musl
    newlib
    picolibc
    pk
    qemu
    spike
    uclibc-ng
    .git/modules

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Report inputs
        run: |
          echo "Artifact name:  ${{ inputs.artifact-name }}"
          echo "OS list:        ${{ inputs.os }}"
          echo "Mode list:      ${{ inputs.mode }}"
          echo "Target list:    ${{ inputs.target }}"
          echo "Compiler list:  ${{ inputs.compiler }}"
          echo "C model list:   ${{ inputs.cmodel }}"
          echo "Report:         ${{ inputs.report }}"
          echo "Languages list: ${{ inputs.languages }}"
          echo "Strip:          ${{ inputs.strip }}"
          echo "Simulator:      ${{ inputs.sim }}"

  validate_inputs:
    name: Validate inputs
    runs-on: ubuntu-latest
    steps:
      - name: Check strip input
        run: |
          if [[ "${{ inputs.strip }}" != "unstripped" && "${{ inputs.strip }}" != "stripped" && "${{ inputs.strip }}" != "both" ]]; then
            echo "Invalid strip option: ${{ inputs.strip }}. Must be one of 'unstripped', 'stripped', 'both'."
            exit 1
          fi

      - name: Check use-prebuilt-gnu input
        if: ${{ inputs.use-prebuilt-gnu }}
        run: |
          # Only LLVM rows have a GNU toolchain to take from somewhere else. Any
          # other row would download an artifact that does not exist and skip
          # the build it is supposed to perform, so require exactly ["llvm"].
          if [ "$(echo '${{ inputs.compiler }}' | tr -d '[]\" ')" != "llvm" ]; then
            echo "use-prebuilt-gnu requires compiler '[\"llvm\"]', got ${{ inputs.compiler }}."
            exit 1
          fi
          # The prebuilt path downloads the unstripped artifact, which is not
          # published when only stripped tarballs are built.
          if [[ "${{ inputs.strip }}" == "stripped" ]]; then
            echo "use-prebuilt-gnu needs strip 'unstripped' or 'both', got 'stripped'."
            exit 1
          fi

  submodule_cache:
    name: Initialize submodule cache
    needs: [validate_inputs]
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.keygen.outputs.smcache_key }}
    steps:
      - uses: actions/checkout@v6

      - name: Remove unneeded frameworks to recover disk space
        run: sudo ./.github/cleanup-rootfs.sh

      - name: Generate submodule cache key
        id: keygen
        run: echo "smcache_key=smcache-$(printf $(git submodule | sha1sum))" >> $GITHUB_OUTPUT

      - name: Setup submodule cache
        id: smcache
        uses: actions/cache@v5
        with:
          path: ${{ env.submodule_paths }}
          key: ${{ steps.keygen.outputs.smcache_key }}

      - name: Checkout required submodules
        if: steps.smcache.outputs.cache-hit != 'true'
        run: |
          # git retries a failed clone once, roughly half a minute later, and
          # then aborts the whole command. That is too short for a server-side
          # error to clear, and it fails the job even when every other submodule
          # cloned fine. Retry the update itself with a growing delay; it is
          # resumable and skips submodules that are already checked out.
          for i in 1 2 3 4 5; do
            if git submodule update --init -j $(nproc) --depth 1 \
                 $(git submodule | awk '{print $2}'); then
              exit 0
            fi
            echo "submodule checkout failed (attempt ${i}), retrying in $((i * 30))s"
            sleep $((i * 30))
          done
          exit 1

      - name: Storage size optimization
        if: steps.smcache.outputs.cache-hit != 'true'
        run: |
          git submodule foreach 'git maintenance run'

  build:
    runs-on: ${{ matrix.os }}
    needs: [submodule_cache,validate_inputs]
    env:
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_DIR: /mnt/ccache
      CCACHE_MAXSIZE: 2G
      smcache_key: ${{ needs.submodule_cache.outputs.key }}
    strategy:
      matrix:
        os: ${{ fromJSON(inputs.os) }}
        mode: ${{ fromJSON(inputs.mode) }}
        target: ${{ fromJSON(inputs.target) }}
        compiler: ${{ fromJSON(inputs.compiler) }}
        sim: ${{ fromJSON(inputs.sim) }}
        cmodel: ${{ fromJSON(inputs.cmodel) }}
        languages: ${{ fromJSON(inputs.languages) }}
        report:
          - ${{ inputs.report }}
        build-sim:
          - ${{ inputs.build-sim }}
        multilib-generator:
          - ${{ inputs.multilib-generator }}

        exclude:
          - mode: uclibc
            compiler: llvm
          - mode: picolibc
            compiler: llvm
    outputs:
      toolchain-name: ${{ steps.toolchain-name-generator.outputs.TOOLCHAIN_NAME }}
    steps:
      - uses: actions/checkout@v6

      - name: generate prebuilt toolchain name
        id:   toolchain-name-generator
        run: |
          if [[ "${{ matrix.target }}" == *"32"* ]]; then BITS=32; else BITS=64; fi
          case "${{ matrix.mode }}" in
            "linux")
              MODE="glibc";;
            "musl")
              MODE="musl";;
            "uclibc")
              MODE="uclibc-ng";;
            "picolibc")
              MODE="elf-picolibc";;
            *)
              MODE="elf";;
          esac
          ARTIFACT_NAME=${{ inputs.artifact-name }}
          if [ -n "$ARTIFACT_NAME" ]; then
            ARTIFACT_NAME="-${ARTIFACT_NAME}"
          fi
          BASE_NAME="riscv$BITS-$MODE-${{ matrix.os }}-${{ matrix.compiler }}"
          echo "TOOLCHAIN_NAME=${BASE_NAME}${ARTIFACT_NAME}" >> $GITHUB_OUTPUT
          echo "TOOLCHAIN_NAME_STRIPPED=${BASE_NAME}-stripped${ARTIFACT_NAME}" >> $GITHUB_OUTPUT
          # Same name, but for the gcc build of this row: what the prebuilt
          # GNU toolchain is published as.
          echo "GNU_NAME=riscv$BITS-$MODE-${{ matrix.os }}-gcc${ARTIFACT_NAME}" >> $GITHUB_OUTPUT

      - name: Remove unneeded frameworks to recover disk space
        run: sudo ./.github/cleanup-rootfs.sh

      - name: Configure swap space
        run: |
          # Hopefully improves CI stability under peak memory pressure.
          echo "Memory before swap:"
          free -h
          swapon --show
          # GitHub-hosted runners already ship with an active /swapfile, so
          # disable and remove it before allocating a larger replacement.
          if swapon --noheadings --show=NAME | grep -qx /swapfile; then
            sudo swapoff /swapfile
          fi
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "Memory after swap:"
          free -h
          swapon --show

      - name: install dependencies
        run: sudo ./.github/setup-apt.sh

      - name: Enable ccache compiler wrappers
        run: echo "/usr/lib/ccache" >> "${GITHUB_PATH}"

      - name: Prepare ccache directory
        run: |
          sudo mkdir -p "${CCACHE_DIR}"
          sudo chown runner:runner "${CCACHE_DIR}"

      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-v1-${{ matrix.os }}-${{ github.run_id }}
          restore-keys: |
            ccache-v1-${{ matrix.os }}-

      - name: Load submodule cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.submodule_paths }}
          key: ${{ env.smcache_key }}

      - name: Initialize ccache
        run: |
          ccache -M "${CCACHE_MAXSIZE}"
          ccache -z
          ccache -s

      - name: Download prebuilt GNU toolchain
        if: ${{ inputs.use-prebuilt-gnu }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.toolchain-name-generator.outputs.GNU_NAME }}
          path: prebuilt-gnu

      - name: Configure toolchain
        env:
          MATRIX_MODE: ${{ matrix.mode }}
          MATRIX_COMPILER: ${{ matrix.compiler }}
          MATRIX_TARGET: ${{ matrix.target }}
          MATRIX_MULTILIB_GENERATOR: ${{ matrix.multilib-generator }}
          MATRIX_SIM: ${{ matrix.sim }}
          MATRIX_CMODEL: ${{ matrix.cmodel }}
          MATRIX_LANGUAGES: ${{ matrix.languages }}
          MATRIX_STRIP: ${{ matrix.strip }}
        run: |
          TARGET_TUPLE=($(echo "$MATRIX_TARGET" | tr "-" "\n"))
          ARGS=(--prefix=/mnt/riscv --with-arch="${TARGET_TUPLE[0]}" --with-abi="${TARGET_TUPLE[1]}")
          if [ "$MATRIX_MODE" == "newlib" ] && [ "$MATRIX_COMPILER" != "llvm" ] && [ -n "$MATRIX_MULTILIB_GENERATOR" ]; then
            ARGS+=(--with-multilib-generator="$MATRIX_MULTILIB_GENERATOR")
          fi
          if [ "$MATRIX_COMPILER" == "llvm" ]; then # build toolchain with llvm
            ARGS+=(--enable-llvm)
          fi
          if [ -n "$MATRIX_SIM" ]; then
            ARGS+=(--with-sim="$MATRIX_SIM")
          fi
          if [ -n "$MATRIX_CMODEL" ]; then
            ARGS+=(--with-cmodel="$MATRIX_CMODEL")
          fi
          if [ -n "$MATRIX_LANGUAGES" ]; then
            ARGS+=(--with-languages="$MATRIX_LANGUAGES")
          fi
          if [ "$MATRIX_STRIP" = "true" ]; then
            ARGS+=(--enable-strip)
          fi
          ./configure "${ARGS[@]}"
          sudo mkdir /mnt/riscv
          sudo chown runner:runner /mnt/riscv

      - name: Restore prebuilt GNU toolchain
        if: ${{ inputs.use-prebuilt-gnu }}
        run: |
          tar xJf prebuilt-gnu/${{ steps.toolchain-name-generator.outputs.GNU_NAME }}.tar.xz -C /mnt/
          rm -rf prebuilt-gnu
          # Fail here rather than somewhere inside the LLVM configure.
          ls /mnt/riscv/bin/*-gcc >/dev/null 2>&1 || {
            echo "error: the restored artifact contains no cross gcc in /mnt/riscv/bin"
            exit 1
          }

      - name: Build toolchain
        if: ${{ !inputs.use-prebuilt-gnu }}
        env:
          MATRIX_MODE: ${{ matrix.mode }}
        run: make -j $(nproc) "$MATRIX_MODE"

      # Build the LLVM stamp directly instead of the "<mode>" aggregate, so that
      # this does not have to track whatever else "<mode>" pulls in. The only
      # prerequisite of stamps/build-llvm-<mode> that the artifact restored above
      # already provides is the stage2 stamp; "-o" marks it up to date without
      # remaking it. This deliberately short-circuits the dependency graph and is
      # only valid because the artifact comes from the gcc job of this same
      # workflow run, built from the same commit.
      - name: Build LLVM on the prebuilt GNU toolchain
        if: ${{ inputs.use-prebuilt-gnu }}
        run: |
          # The ubuntu-22.04 rv64 rows keep losing their runner here. Some Flang
          # sources need a lot of memory to compile, so limit how many of them
          # are compiled at once on that OS.
          make -j $(nproc) \
            FLANG_PARALLEL_COMPILE_JOBS=${{ matrix.os == 'ubuntu-22.04' && 2 || '' }} \
            -o stamps/build-gcc-${{ matrix.mode }}-stage2 \
            stamps/build-llvm-${{ matrix.mode }}

      - name: build simulator
        if: |
          matrix.build-sim == true
        run: |
          make -j $(nproc) build-sim
      # Skip report for newlib multilib builds: running the full testsuite
      # across every multilib variant overruns the 6h job limit. Non-multilib
      # newlib and linux builds get reports.
      - name: make report
        if: |
          matrix.os == 'ubuntu-24.04'
          && (matrix.mode == 'linux' || (matrix.mode == 'newlib' && matrix.multilib-generator == ''))
          && matrix.compiler == 'gcc'
          && matrix.report == true
        run: |
          make report-${{ matrix.mode }} -j $(nproc)

      - name: Show ccache statistics
        if: always()
        run: ccache -s

      # One job per OS writes the cache, and it is a GNU one. A second namespace
      # for the LLVM half would not fit: CCACHE_MAXSIZE is 2G, so two namespaces
      # for two OS versions are 8G, and together with the ~1.7G submodule cache
      # that exceeds GitHub's 10G per repository.
      - name: Save ccache
        if: |
          always()
          && !cancelled()
          && github.event_name != 'pull_request'
          && matrix.mode == 'linux'
          && matrix.target == 'rv64gc-lp64d'
          && matrix.compiler == 'gcc'
          && matrix.sim == ''
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-v1-${{ matrix.os }}-${{ github.run_id }}

      - name: Remove build trees before packaging
        run: |
          rm -rf build-* stamps install-host-gcc install-newlib-nano
      - name: tarball build unstripped
        if: ${{ inputs.strip == 'unstripped' || inputs.strip == 'both' }}
        run: |
          du -s -h /mnt/riscv
          ./.github/dedup-dir.sh /mnt/riscv/
          XZ_OPT="-e -T0" tar cJvf riscv.tar.xz -C /mnt/ riscv/
          mv riscv.tar.xz ${{ steps.toolchain-name-generator.outputs.TOOLCHAIN_NAME }}.tar.xz
      - name: strip binaries
        run: |
          # Strip all ELF binaries in the toolchain
          # finds all of the files in /mnt/riscv, checks if they are ELF files, and strips them
          # strip itself would be fine running on any files, it will just complain if they are
          # not valid binaries. But that would capture the `.a` archives as well,
          # which we do not want to strip. Doing so would make linking them later problematic.
          # The logic:
          # 1. Find all files under /mnt/riscv
          # 2. For each file, run `file` command to check its type
          # 3. If the output of `file` contains "ELF", it is an ELF binary
          # 4. Strip that file
          # 5. Ignore others
          find /mnt/riscv -type f -exec sh -c 'file "$1" | grep -q "ELF" && strip "$1"' _ {} \;
      - name: tarball build stripped
        if: ${{ inputs.strip == 'stripped' || inputs.strip == 'both' }}
        run: |
          du -s -h /mnt/riscv
          XZ_OPT="-e -T0" tar cJvf riscv-stripped.tar.xz -C /mnt/ riscv/
          mv riscv-stripped.tar.xz ${{ steps.toolchain-name-generator.outputs.TOOLCHAIN_NAME_STRIPPED }}.tar.xz
      - uses: actions/upload-artifact@v7
        if: ${{ inputs.strip == 'unstripped' || inputs.strip == 'both' }}
        with:
          name: ${{ steps.toolchain-name-generator.outputs.TOOLCHAIN_NAME }}
          path: ${{ steps.toolchain-name-generator.outputs.TOOLCHAIN_NAME }}.tar.xz
          compression-level: 0
      - uses: actions/upload-artifact@v7
        if: ${{ inputs.strip == 'stripped' || inputs.strip == 'both' }}
        with:
          name: ${{ steps.toolchain-name-generator.outputs.TOOLCHAIN_NAME_STRIPPED }}
          path: ${{ steps.toolchain-name-generator.outputs.TOOLCHAIN_NAME_STRIPPED }}.tar.xz
          compression-level: 0
